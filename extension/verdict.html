<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Real Eyes — claim verification</title>
    <style>
      :root {
        --bg:        #0b0f1a;
        --bg2:       #111827;
        --card:      #131a2b;
        --line:      #1e2a44;
        --muted:     #8aa1c8;
        --text:      #ecf2ff;
        --green:     #1dcea0;
        --green-dim: #0f6e57;
        --red:       #ef4444;
        --red-dim:   #7a1f1f;
        --amber:     #f59e0b;
        --amber-dim: #6b4308;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #1c2a4d 0%, transparent 60%),
                    radial-gradient(900px 500px at 100% 0%, #1a3528 0%, transparent 55%),
                    var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-height: 100%;
      }
      header {
        padding: 18px 32px;
        display: flex; align-items: center; gap: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(11,15,26,0.6);
        backdrop-filter: blur(8px);
        position: sticky; top: 0; z-index: 10;
      }
      header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
      header h1   { margin: 0; font-size: 14px; letter-spacing: 2px; color: var(--green); }

      main { max-width: 1100px; margin: 0 auto; padding: 36px 28px 60px; }

      /* ── Hero verdict ───────────────────────────────────────── */
      .hero {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 36px 32px 28px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 60%), var(--card);
        overflow: hidden;
      }
      .hero::before {
        content: ""; position: absolute; inset: 0;
        background: var(--accent-glow, transparent);
        opacity: 0.18; pointer-events: none;
      }
      .verdict-row {
        display: flex; flex-wrap: wrap; align-items: center;
        gap: 24px; position: relative;
      }
      .verdict-badge {
        font-size: 34px; font-weight: 800; letter-spacing: 1px;
        padding: 14px 22px; border-radius: 14px;
        border: 1px solid var(--accent, var(--green));
        color: var(--accent, var(--green));
        background: var(--accent-bg, rgba(29,206,160,0.08));
        text-transform: uppercase;
        display: flex; align-items: center; gap: 14px;
      }
      .verdict-badge .icon { font-size: 28px; }
      .conf {
        display: flex; flex-direction: column; gap: 2px;
      }
      .conf .num {
        font-size: 42px; font-weight: 800; color: var(--text);
        letter-spacing: 1px; line-height: 1;
      }
      .conf .label {
        font-size: 11px; letter-spacing: 2px; color: var(--muted);
      }
      .verified-pill {
        margin-left: auto;
        padding: 8px 14px; border-radius: 999px;
        font-size: 12px; letter-spacing: 1px;
        border: 1px solid var(--accent, var(--green));
        color: var(--accent, var(--green));
        background: var(--accent-bg, rgba(29,206,160,0.08));
      }
      .verified-pill.unverified { color: var(--muted); border-color: var(--line); background: transparent; }

      .claim {
        margin-top: 24px;
        padding: 18px 20px;
        border-left: 3px solid var(--accent, var(--green));
        background: rgba(255,255,255,0.03);
        border-radius: 6px;
        font-size: 16px; line-height: 1.5;
        color: var(--text);
        white-space: pre-wrap; word-break: break-word;
      }
      .claim .label { display:block; color: var(--muted); font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }

      .statement {
        margin-top: 18px; color: var(--muted); font-size: 14px;
      }

      /* ── Confidence bar ──────────────────────────────────────── */
      .bar-wrap { margin-top: 22px; }
      .bar-wrap .track {
        position: relative; height: 8px; border-radius: 999px;
        background: rgba(255,255,255,0.05); overflow: hidden;
      }
      .bar-wrap .fill {
        position: absolute; left: 0; top: 0; bottom: 0;
        background: var(--accent, var(--green));
        box-shadow: 0 0 18px var(--accent, var(--green));
        border-radius: 999px;
      }
      .bar-wrap .legend {
        display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px;
      }

      /* ── Source list ─────────────────────────────────────────── */
      h2.section {
        margin: 36px 0 12px; font-size: 12px; letter-spacing: 2px;
        color: var(--muted); text-transform: uppercase;
      }
      .src {
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        margin-bottom: 12px;
      }
      .src-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .src-domain {
        font-weight: 700; color: var(--text); font-size: 14px;
        text-decoration: none;
      }
      .src-domain:hover { color: var(--green); }
      .nli-chip {
        padding: 2px 8px; border-radius: 6px; font-size: 11px; letter-spacing: 1px;
        border: 1px solid currentColor;
      }
      .nli-chip.supports { color: var(--green); }
      .nli-chip.refutes  { color: var(--red); }
      .nli-chip.nei      { color: var(--amber); }
      .trusted {
        padding: 2px 8px; border-radius: 6px; font-size: 10px; letter-spacing: 1px;
        border: 1px solid var(--green); color: var(--green);
        background: rgba(29,206,160,0.08);
      }
      .src-meta {
        margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap;
        font-size: 11px; color: var(--muted);
      }
      .src-meta .pct.s { color: var(--green); }
      .src-meta .pct.r { color: var(--red); }
      .src-meta .pct.n { color: var(--amber); }
      .snippet {
        margin-top: 10px; padding: 10px 12px; border-radius: 8px;
        background: rgba(255,255,255,0.03); color: #c7d2e8;
        font-size: 13px; line-height: 1.5;
      }
      .empty {
        text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="dot"></div>
      <h1>REAL EYES — CLAIM VERIFICATION</h1>
    </header>
    <main id="root"></main>
    <script src="verdict.js"></script>
  </body>
</html>
